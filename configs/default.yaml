# Portfolio-optimization-lab default configuration.
# Loaded by scripts/run_optimization.py via load_config() — STRICT: unknown
# keys raise ValueError. All values can also be overridden programmatically
# via OptConfig.
# The data window (sample start/end) is NOT set here: it is controlled by
# scripts/download_data.py (--start/--end), and the cached CSVs in data/raw/
# define the actual estimation+evaluation sample.
tickers: [AAPL, MSFT, JNJ, JPM, XOM, PG, AMZN]
benchmark: SPY
rf_annual: 0.0          # risk-free assumption, disclosed in all outputs
estimation_window: 252  # trading days
holding_period: 63      # out-of-sample days per rebalance (~1 quarter)
max_weight: 0.40        # per-asset cap
cost_bps: 10            # per unit turnover at each rebalance
frontier_points: 30
seed: 42
